[project]
name = "ummannaq-ice"
version = "0.1.0"
description = "Sentinel-2 sea-ice classification pipeline for the Uummannaq fjord"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<3.0",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "pystac-client>=0.7,<0.9",
  "odc-stac>=0.3.9",
  "dask[array]>=2024.5",
  "xarray>=2024.6",
  "rasterio>=1.3",        # for COG reading in odc-stac stack
  "boto3>=1.28",          # S3 access (earth-search can redirect)
  "pyyaml>=6.0",
  # used by scripts/check_summary.py and scripts/validate_sar.py; it was
  # imported without being declared until 2026-08-04
  "pandas>=2.0",
  # critical pins for SMP:
  "segmentation-models-pytorch==0.3.3",
  "timm==0.9.2",
]

[project.optional-dependencies]
dev = [
  "ipython",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-requests",
  "types-Pillow",
  "types-PyYAML",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-section-index>=0.3",
]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-PyYAML",
]

[project.scripts]
uummannaq-ice = "uummannaq_ice.cli:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# archive/ holds the superseded first pipeline, kept verbatim as the record of
# what this project used to be. It predates the hook and does not pass it, so
# linting it means any touch of those files, a credential scrub for instance,
# is blocked by style complaints about code nobody will run again.
extend-exclude = ["archive"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"uummannaq_ice" = ["assets/*", "models/*"]

[tool.pip]
# (left empty intentionally; we'll install torch/torchvision separately)

# install instructions: cd ice-run
# python3 -m venv .venv
# source .venv/bin/activate

# 1 Install PyTorch + torchvision for macOS (Metal/MPS)
# pip install --upgrade pip
#cpip install "torch==2.7.*" "torchvision==0.22.*"

# 2 Install project deps from pyproject
# pip install -e .
