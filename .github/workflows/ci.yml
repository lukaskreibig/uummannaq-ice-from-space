name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}-${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.7.0" "torchvision==0.22.0" "torchaudio==2.7.0"
          python -m pip install -e ".[dev,test]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Type check
        run: mypy src/uummannaq_ice

      - name: Test with pytest
        run: pytest --cov=uummannaq_ice --cov-report=term-missing

      # The analysis layer produces every published figure and used to sit
      # outside CI entirely. These two run offline against the committed
      # archive, so they gate the numbers rather than only the code.
      - name: Archive integrity
        run: python scripts/check_summary.py archive/reprocessed_2026/summary.csv

      - name: Published numbers have not drifted
        run: python scripts/story_numbers.py --expect docs/published_numbers.json
