name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of requires-python, not every minor in
        # between. 3.13 is here because it is what the venv runs and what the
        # declared range promises; it was promised and never tested until now.
        # 3.14 has to wait for a torch that ships a cp314 wheel.
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # There is no "Install system dependencies" step any more. It ran
      # `apt-get install gdal-bin libgdal-dev libgl1` and it was the step that
      # hung, three times in a row and always on the 3.10 job. None of the three
      # had a consumer. libgl1 exists for opencv, which is not a dependency and
      # is not installed. libgdal-dev is headers for compiling against GDAL, and
      # rasterio arrives as a wheel carrying its own GDAL 3.9.3. gdal-bin is the
      # command line tools, and nothing here shells out to gdalwarp, ogr2ogr or
      # any of the others. Checked the other way round too: neither `osgeo` nor
      # `cv2` is importable in the development environment, where the whole
      # suite passes.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "torch==2.7.0" "torchvision==0.22.0" "torchaudio==2.7.0"
          python -m pip install -e ".[dev,test]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      - name: Type check
        run: mypy src/uummannaq_ice

      - name: Test with pytest
        run: pytest --cov=uummannaq_ice --cov-report=term-missing

      # The analysis layer produces every published figure and used to sit
      # outside CI entirely. These two run offline against the committed
      # archive, so they gate the numbers rather than only the code.
      - name: Archive integrity
        run: python scripts/check_summary.py archive/reprocessed_2026/summary.csv

      - name: Published numbers have not drifted
        run: python scripts/story_numbers.py --expect docs/published_numbers.json

      # Every analysis that runs from the committed archive alone. Two of them
      # refuse to print anything unless the published headline still reproduces,
      # so this catches a change to the estimator that the two gates above would
      # not see: they check the numbers, this checks that the checks still work.
      - name: Offline analyses still run
        run: make audit
